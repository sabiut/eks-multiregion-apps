# The application pipeline. Continuous integration only: it never touches a cluster, and it
# does not decide what runs where.
#
#   pull request   test the backend, build both images, scan them
#   merge to main  the same, then push both images to ECR in both regions, and ask the
#                  GitOps repository to put this version into dev
#
# BUILD ONCE: the images are built here, one time, and tagged with the commit. dev, stg and
# prd all run these exact images. Nothing is rebuilt for a later environment, so what was
# tested is what ships. Moving a version onward is the GitOps repository's job.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/ci.yml"]

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_REGION: ap-southeast-2
  REGIONS: ap-southeast-2 ap-southeast-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the backend's dependencies
        run: pip install --quiet -r backend/requirements.txt
      # A real PostgreSQL beside the job, for the integration tests. Its password is
      # generated here for this run only: it is never written in the repository, it is
      # masked in the log, and it disappears with the runner.
      - name: Start PostgreSQL with a one-time password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "TEST_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name test-postgres -e POSTGRES_PASSWORD="$password" -p 127.0.0.1:5432:5432 postgres:17-alpine
          # Check over TCP: during first start-up the server briefly answers on its local socket only.
          until docker exec test-postgres pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; do sleep 1; done
      - name: Unit and integration tests
        working-directory: backend
        env:
          TEST_DB_HOST: 127.0.0.1
        run: python3 -m unittest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: demo-api, context: backend}    # backend tier
          - {name: demo-web, context: frontend}   # frontend tier
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        id: meta
        # The tag is the commit, so every image traces back to the code that built it.
        # Both images get the same tag: one version number describes the whole release.
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build -t "${{ matrix.name }}:${{ steps.meta.outputs.tag }}" "${{ matrix.context }}"
      - name: Sign in to AWS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}

      # Tags are immutable in ECR: a second push of the same tag is refused. So a run that
      # failed half way (pushed to one region, not the other) must be safe to run again.
      # If an earlier attempt already published this tag, THAT image is the release, not
      # the one this run just rebuilt (a rebuild can differ). Choosing it here, before the
      # scan, means the image that is scanned is the image that is released.
      - name: Choose the image to release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          IMAGE: ${{ matrix.name }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          for region in $REGIONS; do
            registry="$account.dkr.ecr.$region.amazonaws.com"
            aws ecr get-login-password --region "$region" | docker login --username AWS --password-stdin "$registry"
          done
          for region in $REGIONS; do
            digest=$(aws ecr batch-get-image --region "$region" --repository-name "$IMAGE" --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' --output text 2>/dev/null | grep -E '^sha256:' || true)
            if [ -n "$digest" ]; then
              published="$account.dkr.ecr.$region.amazonaws.com/$IMAGE:$TAG"
              docker pull --quiet "$published"
              docker tag "$published" "$IMAGE:$TAG"    # replaces the rebuild
              echo "Using the image already published in $region ($digest)."
              break
            fi
          done

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"   # a critical vulnerability with a fix available stops the release

      - name: Push to ECR in each region
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          IMAGE: ${{ matrix.name }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          digest_in() {   # the digest of this tag in a region, or nothing
            aws ecr batch-get-image --region "$1" --repository-name "$IMAGE" --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' --output text 2>/dev/null | grep -E '^sha256:' || true
          }
          # Push the scanned image to every region that does not have the tag yet.
          for region in $REGIONS; do
            target="$account.dkr.ecr.$region.amazonaws.com/$IMAGE:$TAG"
            if [ -n "$(digest_in "$region")" ]; then
              echo "$region already has $IMAGE:$TAG"
            else
              docker tag "$IMAGE:$TAG" "$target"
              docker push --quiet "$target"
            fi
          done

          # The release goes ahead only if EVERY region answers with a digest, and they
          # are all the same. A region with no image must fail this, not be ignored.
          first=""
          for region in $REGIONS; do
            digest=$(digest_in "$region")
            [ -n "$digest" ] || { echo "$region has no image for $IMAGE:$TAG"; exit 1; }
            [ -z "$first" ] && first=$digest
            [ "$digest" = "$first" ] || { echo "$region holds $digest, but another region holds $first"; exit 1; }
          done
          echo "$IMAGE:$TAG is $first in every region" >> "$GITHUB_STEP_SUMMARY"

  release-to-dev:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release bot is a GitHub App installed on the GitOps repository only. It may
      # start that repository's promote workflow. It cannot approve or merge anything there.
      - name: Token for the release bot
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.GITOPS_REPO_NAME }}
      - name: Ask the GitOps repository to put this version into dev
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITOPS_REPO: ${{ github.repository_owner }}/${{ vars.GITOPS_REPO_NAME }}
        run: |
          tag=$(git rev-parse --short=7 HEAD)
          gh workflow run promote.yml --repo "$GITOPS_REPO" -f to=dev -f tag="$tag"
          echo "Built \`$tag\` and asked $GITOPS_REPO to promote it to dev." >> "$GITHUB_STEP_SUMMARY"
